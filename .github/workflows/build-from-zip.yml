name: Build Facebook Akun Tumbal APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project ZIP
        run: |
          ZIP_FILE="Facebook_Akun_Tumbal_UPLOAD_SATU_ZIP.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP tidak ditemukan: $ZIP_FILE"
            echo "File di root repo:"
            ls -la
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate Android project
        run: |
          SETTINGS_FILE="$(find extracted -type f -name settings.gradle -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle tidak ditemukan di dalam ZIP."
            echo "Isi ZIP:"
            find extracted -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/build.gradle" ] || [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "File Gradle proyek tidak lengkap di: $PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Facebook-Akun-Tumbal-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
