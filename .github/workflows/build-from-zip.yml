name: Build APK from uploaded ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'Facebook_Akun_Tumbal_Project.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project ZIP
        run: |
          unzip -o Facebook_Akun_Tumbal_Project.zip -d project

      - name: Build APK
        run: |
          cd project
          gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Facebook-Akun-Tumbal-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
