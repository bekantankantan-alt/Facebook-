
name: Build Facebook Akun Tumbal APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Facebook_Akun_Tumbal_UPLOAD_SATU_ZIP.zip'
      - '.github/workflows/build-from-zip.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract outer ZIP
        run: |
          unzip -o Facebook_Akun_Tumbal_UPLOAD_SATU_ZIP.zip -d uploaded

      - name: Extract Android project ZIP
        run: |
          unzip -o uploaded/Facebook_Akun_Tumbal_Project.zip -d project

      - name: Check project files
        run: |
          ls -la project
          test -f project/settings.gradle
          test -f project/app/build.gradle
          test -f project/app/src/main/assets/index.html

      - name: Build debug APK
        run: |
          cd project
          gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Facebook-Akun-Tumbal-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
